spring:
  config:
    activate:
      on-profile: local
  database:
    url: "jdbc:h2:mem:library;MODE=MYSQL;NON_KEYWORDS=USER"
    username: "sa"
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2: #h2DB에 접속할 수 있게 하는 것
    console:
      enabled: true
      path: /h2-console

---
spring:  # dev일때만 아래 설정이 작동하게 만드는 명령?
  config:
    activate:
      on-profile: dev

  datasource:
    url: "jdbc:mysql://localhost:3306/library"
    username: "root"
    password: "Abcd1234!"
    driver-class-name : com.mysql.cj.jdbc.Driver

  jap:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect